<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact Dev Team - ScholrAnalytics</title>
  <style>
    :root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#64748b;--primary:#2563eb;--border:#e2e8f0;--radius:14px;--shadow:0 12px 30px rgba(15,23,42,.06)}
    body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#eef4ff,#f8fafc);color:var(--text);}
    .container{max-width:880px;margin:36px auto;padding:18px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
    .brand{display:flex;gap:14px;align-items:center;margin-bottom:12px}
    .logo{width:70px;height:45px;border-radius:10px;overflow:hidden}
    .logo img{width:100%;height:100%;object-fit:contain}
    h1{margin:0 0 6px;font-size:20px}
    p.lead{color:var(--muted);margin:0 0 14px}
    .details{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:14px}
    .details b{display:block}
    .contact-block{display:flex;flex-direction:column;gap:6px}
    .contact-label{font-weight:800;color:#0f172a;font-size:13px}
    .contact-field{
      background:rgba(255,255,255,0.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
      padding:10px 12px;border-radius:10px;border:1px solid var(--border);box-shadow:0 8px 20px rgba(16,24,40,0.04);
      color:var(--text);display:inline-block;font-size:14px
    }
    .contact-field a{color:var(--primary);text-decoration:none}
    .contact-field a:hover{text-decoration:underline}
    form{display:grid;gap:12px}
    input,textarea{
      width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;font-size:14px;
      background:rgba(255,255,255,0.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
      box-shadow:0 8px 20px rgba(16,24,40,0.04);transition:box-shadow .18s ease,transform .12s ease,border-color .12s;
    }
    input:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 14px 40px rgba(37,99,235,0.12);transform:translateY(-2px)}
    button{background:var(--primary);color:#fff;border:0;padding:10px 14px;border-radius:10px;cursor:pointer;box-shadow:0 6px 18px rgba(37,99,235,0.12)}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .muted{color:var(--muted);font-size:14px}
    a.back{display:inline-flex;align-items:center;gap:8px;margin-top:5px;color:var(--primary);text-decoration:none;padding:10px 14px;background:linear-gradient(90deg,#ffffff,#fbfdff);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 20px rgba(16,24,40,0.06);transition:transform .12s ease,box-shadow .12s ease}
    a.back:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(16,24,40,0.12)}
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="brand">
        <div class="logo"><img src="assets/LogoR.png" alt="ARTS"></div>
        <div>
          <h1>Get In Touch with ARTechSolutions </h1>
          <p class="lead">Have a project in mind? Let's talk about how we can help you achieve your goals.</p>
        </div>
      </div>

      <div class="details">
        <div class="contact-block">
          <div class="contact-label">Founder & CEO</div>
          <div class="contact-field">Muhammad Arsalan</div>
        </div>
        <div class="contact-block">
          <div class="contact-label">Email Us</div>
          <div class="contact-field"><a href="mailto:artechsolutions.info@gmail.com">artechsolutions.info@gmail.com</a></div>
        </div>
        <div class="contact-block">
          <div class="contact-label">Call Us</div>
          <div class="contact-field"><a href="tel:+923121578099">+92 312 1578099</a></div>
        </div>
      </div>

      <form id="contactForm" action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="f10df513-ea8a-4645-a40f-a2d742d8b6a5">
        <input id="name" name="name" placeholder="Your name" required />
        <input id="email" name="email" type="email" placeholder="Your email" required />
        <input id="subject" name="subject" placeholder="Subject (e.g. Project inquiry)" required />
        <textarea id="message" name="message" rows="6" placeholder="Describe your project or question" required></textarea>
        <div id="formResponse" style="display:none;padding:10px;border-radius:8px;margin-bottom:6px"></div>
        <div class="row">
          <button type="submit">✉️ Contact Dev Team</button>
          <a class="back" href="index.html">← Back to Dashboard</a>
        </div>
      </form>
    </div>
  </div>
  <script>
    document.getElementById('contactForm').addEventListener('submit',async function(e){
      e.preventDefault();
      const form=this;
      const responseEl=document.getElementById('formResponse');
      responseEl.style.display='none';
      const data={
        access_key: form.querySelector('input[name="access_key"]').value,
        name: form.name.value.trim(),
        email: form.email.value.trim(),
        subject: form.subject.value.trim(),
        message: form.message.value.trim()
      };
      if(!data.name||!data.email||!data.subject||!data.message){alert('Please fill all fields.');return}
      try{
        const res=await fetch(form.action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
        const json=await res.json();
        if(json.success || json.message==='Successfully submitted'){ // web3forms success
          responseEl.style.display='block';responseEl.style.background='#dcfce7';responseEl.style.border='1px solid #16a34a';responseEl.style.color='#064e3b';responseEl.textContent='Message sent — we will get back to you shortly.';
          form.reset();
        } else {
          responseEl.style.display='block';responseEl.style.background='#fee2e2';responseEl.style.border='1px solid #dc2626';responseEl.style.color='#7f1d1d';responseEl.textContent='Could not send message. Please try again or email artechsolutions7@gmail.com';
        }
      }catch(err){
        responseEl.style.display='block';responseEl.style.background='#fee2e2';responseEl.style.border='1px solid #dc2626';responseEl.style.color='#7f1d1d';responseEl.textContent='Network error. Please check your connection and try again.';
      }
    });
  </script>
</body>
</html>
